[project]
name = "parakeet-dictate"
version = "0.1.0"
description = "Local push-to-talk dictation for Windows using NVIDIA Parakeet"
authors = [
    { name = "Miguel Machado", email = "hello@miguelmachado.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.13.1",
    "huggingface-hub>=2.2.0",
    "numpy>=2.5.3",
    "onnx-asr>=0.12.0",
    "onnxruntime-gpu[cuda,cudnn]>=1.31.0",
    "pillow>=12.3.0",
    "pynput>=1.8.2",
    "pystray>=0.19.5",
    "sounddevice>=0.5.6",
]

[project.scripts]
parakeet-dictate = "parakeet_dictate.app:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
