# Use Settings from the tray, or copy this file to config.toml and uncomment settings to change.
# Restart the app after editing: run `uv run parakeet-dictate --quit`, then start it again.

# Hold to talk; tap quickly for hands-free. Any pynput Key name, for example
# ctrl_r, ctrl_l, shift_r, f13 to f24, pause, scroll_lock, insert.
# Avoid alt_r: on Portuguese and many other layouts Right Alt is AltGr.
# hotkey = "ctrl_r"

# Releasing sooner than this after the press switches to hands-free (milliseconds).
# tap_threshold_ms = 300

# "cuda" (fp32 on the GPU, falls back to CPU at startup if CUDA fails) or "cpu" (int8).
# provider = "cuda"

# Short start, stop, cancel, and error tones.
# sounds = true

# Add a space after each dictation so consecutive ones do not run together.
# append_space = true

# The live microphone visualizer near the bottom of the screen while you dictate.
# "fluid" draws flowing ribbons, "bars" draws mirrored bars, and "off" hides it.
# The window never takes focus and lets clicks through.
# overlay = "fluid"

# Model folder, relative to the project root or absolute.
# model_dir = "models/parakeet-tdt-0.6b-v3"

# Keep [postprocess], [server], and [[app_rules]] after the general settings: every
# setting after a table header belongs to that table, until the next header.

# Post-processing: send each transcript to GLM through Z.ai or Claude through Anthropic
# to remove fillers and fix punctuation before pasting. Audio stays on this PC.
# [postprocess]

# Initial state of the tray's "Post-process with GLM/Claude" item. Once you toggle it,
# the tray choice is saved in tray_choices.json and wins over this setting.
# enabled = true

# "zai" needs ZAI_API_KEY; "anthropic" needs ANTHROPIC_API_KEY, in the environment or .env.
# provider = "zai"

# Omit model and endpoint to follow the provider: glm-5.3 and the Z.ai URL below, or
# claude-haiku-5-5 and https://api.anthropic.com/v1/messages. Claude also accepts claude-sonnet-5-5.
# Remove old model/endpoint overrides when switching provider.
# model = "glm-5.3"
# endpoint = "https://api.z.ai/api/coding/paas/v4/chat/completions"

# Z.ai: "low", "high", or "max". GLM-5.3 always reasons; higher effort is slower.
# reasoning_effort = "low"

# Anthropic: thinking off is fastest. "xhigh" and "max" effort require thinking = true.
# effort accepts "low", "medium", "high", "xhigh", or "max".
# thinking = false
# effort = "low"

# Seconds to wait for post-processing before pasting the raw transcript.
# timeout_s = 8.0

# Appended to the system prompt. List names and jargon to spell correctly, for example
# "Names: Miguel, João. Terms: Parakeet, Z.ai, GLM."
# extra_instructions = ""

# Server for Mac: lets a Mac dictate through this PC's model and selected post-processor.
# See docs/mac-client.md. The token is in server_token.txt, created on first start.
# [server]

# Initial state of the tray's "Server for Mac" item. Once you toggle the item,
# the tray choice is saved in tray_choices.json and wins over this setting.
# enabled = false

# TCP port. scripts/allow_mac.ps1 opens it in Windows Firewall for the local subnet.
# port = 8765

# The IPv4 address to listen on. "0.0.0.0" listens on every network adapter.
# bind = "0.0.0.0"

# App rules for local dictations. Edit them in Settings > App rules, or copy this block.
# Uses the executable of the foreground window when recording ends, case-insensitively.
# Find executable names in Task Manager > Details. No paths or wildcards.
# Matching, enabled rules are combined in file order and post-process even with the
# tray toggle off. They still need the selected provider's key. Restart after editing.
# This example stays disabled until enabled = true.
# [[app_rules]]
# name = "Translate to English"
# apps = ["Slack.exe", "Discord.exe"]
# instructions = "Translate the transcript to English."
# enabled = false
